name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**

jobs:
  ##############################################################################
  # Code Quality
  ##############################################################################
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

  stesp:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Dependencies
      run: |
        uv sync --dev

    - name: Ruff
      run: |
        uv run ruff check .

    - name: Black
      run: |
        uv run black --check .

    - name: isort
      run: |
        uv run isort --check-only .

    - name: MyPy
      run: |
        uv run mypy scripts

  ##############################################################################
  # Unit Tests
  ##############################################################################
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --dev

      - name: Run Unit Tests
        run: |
          uv run pytest tests/unit -v
